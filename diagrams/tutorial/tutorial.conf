name: tutorial
option:
  http_broker:
    start: true
    port: 8000
plugins:
  process_factories:
    increment_process:
      path: "./target/debug"
  container_factories:
    example_container:
      path: "./target/debug"
      processes:
        example_container_increment:
          path: "./target/debug"
        example_container_get:
          path: "./target/debug"
processes:
  - type_name: increment_process
    name: inc0
  - type_name: increment_process
    name: inc1
containers:
  - type_name: example_container
    name: counter0
    processes:
      - type_name: example_container_increment
        name: increment0
      - type_name: example_container_get
        name: get0
