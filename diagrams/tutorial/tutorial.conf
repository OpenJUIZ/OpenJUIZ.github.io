name: my_juiz
option:
  http_broker:
    start: true
    port: 8000
plugins:
  components:
    my_juiz:
      language: rust
      path: "plugins/{target}"
processes:
  - type_name: my_juiz_add
    name: my_juiz_add0
  - type_name: my_juiz_add
    name: my_juiz_add1
containers:
  - type_name: counter
    name: counter0
    initial_value: 0
    processes:
      - type_name: counter_increment
        name: counter_increment0
      - type_name: counter_get
        name: counter_get0
