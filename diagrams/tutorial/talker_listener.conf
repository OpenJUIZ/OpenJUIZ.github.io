name: talker_listener
option:
  http_broker:
    start: true
    port: 8000
plugins:
  components:
    talker:
      language: rust
      path: talker/app/plugins/{target}
    listener:
      language: rust
      path: listener/app/plugins/{target}
processes:
  - type_name: talker_talk
    name: talker_talk0
  - type_name: listener_listen
    name: listener_listen0
connections:
  - name: con0
    connection_type: Push
    source:
      name: talker_talk0
      type_name: talker_talk
    destination:
      name: listener_listen0
      type_name: listener_listen
    arg_name: arg1
ecs:
  - name: ec0
    type_name: main_loop_ec
    rate: 1.0
    bind:
      - name: talker_talk0
        type_name: talker_talk
    auto_start: true
