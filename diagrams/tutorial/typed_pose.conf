name: typed_pose
option:
  http_broker:
    start: true
    port: 8000
  # Python のプラグインの場所 (./python) から見た、Python の型 (gen/) の場所
  pythonpath: ["../gen"]
plugins:
  process_factories:
    pose_move:
      path: "./target/debug"
    twist_python:
      language: python
      path: "./python"
    pose_print_python:
      language: python
      path: "./python"
processes:
  - type_name: twist_python
    name: twist0
  - type_name: pose_move
    name: move0
  - type_name: pose_print_python
    name: print0
connections:
  - name: twist_to_move
    connection_type: Pull
    source:
      name: twist0
      type_name: twist_python
    destination:
      name: move0
      type_name: pose_move
    arg_name: twist
  - name: move_to_print
    connection_type: Push
    source:
      name: move0
      type_name: pose_move
    destination:
      name: print0
      type_name: pose_print_python
    arg_name: pose
