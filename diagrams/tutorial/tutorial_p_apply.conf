name: tutorial
option:
  http_broker:
    start: true
    port: 8000
plugins:
  process_factories:
    increment_process:
      path: "./target/debug"
  container_factories:
    example_container:
      path: "./target/debug"
      processes:
        example_container_increment:
          path: "./target/debug"
        example_container_get:
          path: "./target/debug"
processes:
  - type_name: increment_process
    name: inc0
    p_apply:
      arg1: 10
  - type_name: increment_process
    name: inc1
containers:
  - type_name: example_container
    name: counter0
    initial_value: 3
    processes:
      - type_name: example_container_increment
        name: increment0
        p_apply:
          arg1: 5
      - type_name: example_container_get
        name: get0
