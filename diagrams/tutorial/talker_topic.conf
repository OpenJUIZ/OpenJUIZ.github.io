"name": "talker"
"option":
  "http_broker":
    "start": true
    "port": 8001
"mastersystem":
  "broker_type": "http"
  "broker_name": "127.0.0.1:8000"
"plugins":
  "components":
    "talker":
      "language": "rust"
      "path": "plugins/{target}"
"processes":
  - "type_name": "talker_talk"
    "name": "talker_talk0"
    "publishes":
      - "chatter"
"ecs":
  - "type_name": "main_loop_ec"
    "name": "talker_ec"
    "rate": 1.0
    "bind":
      - "type_name": "talker_talk"
        "name": "talker_talk0"
    "auto_start": true
